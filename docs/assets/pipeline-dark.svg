<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Pipeline: conversation, extraction, structured state, relationships, retrieval, grounded answer">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #e6edf3; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { fill: #9198a1; }
  .accent { fill: #ffb847; }
  .link { fill: #a5a5ff; }
  .good { fill: #3fb950; }
  .lane { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #9198a1; }
  .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
  .wire { stroke: #9198a1; stroke-width: 1.6; fill: none; }
  .flow { stroke: #ffb847; stroke-width: 2; fill: none; stroke-dasharray: 6 7;
           animation: flow 1.1s linear infinite; }
  .bar { fill: #ffb847; transform-box: fill-box; transform-origin: center;
          animation: wave 1.5s ease-in-out infinite; }
  .pulse { transform-box: fill-box; transform-origin: center;
            animation: pulse 3.2s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  @keyframes wave { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .75; }
                      50% { transform: scale(1.06); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .bar, .pulse { animation: none; } }
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9198a1"/></marker><marker id="tipA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffb847"/></marker></defs>
<rect class="panel" x="1" y="1" width="1198" height="228" rx="16"/>
<text class="lane" x="26" y="36">FROM WHAT WAS SAID TO WHAT IS KNOWN</text>
<rect x="26" y="62" width="168" height="118" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
<text class="accent" x="42" y="90" font-size="12" font-weight="700">01</text>
<text x="42" y="118" font-size="16" font-weight="700">Conversation</text>
<text class="muted" x="42" y="143" font-size="12.5">mic + system audio</text>
<text class="muted" x="42" y="161" font-size="12.5">one live transcript</text>
<path class="flow" marker-end="url(#tipA)" d="M197 121 H219"/>
<rect x="222" y="62" width="168" height="118" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
<text class="accent" x="238" y="90" font-size="12" font-weight="700">02</text>
<text x="238" y="118" font-size="16" font-weight="700">Extraction</text>
<text class="muted" x="238" y="143" font-size="12.5">debounced, batched,</text>
<text class="muted" x="238" y="161" font-size="12.5">credential-gated</text>
<path class="flow" marker-end="url(#tipA)" d="M393 121 H415"/>
<rect x="418" y="62" width="168" height="118" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
<text class="accent" x="434" y="90" font-size="12" font-weight="700">03</text>
<text x="434" y="118" font-size="16" font-weight="700">Structured state</text>
<text class="muted" x="434" y="143" font-size="12.5">items · decisions</text>
<text class="muted" x="434" y="161" font-size="12.5">events · memories</text>
<path class="flow" marker-end="url(#tipA)" d="M589 121 H611"/>
<rect x="614" y="62" width="168" height="118" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
<text class="accent" x="630" y="90" font-size="12" font-weight="700">04</text>
<text x="630" y="118" font-size="16" font-weight="700">Relationships</text>
<text class="muted" x="630" y="143" font-size="12.5">typed edges only,</text>
<text class="muted" x="630" y="161" font-size="12.5">never inferred</text>
<path class="flow" marker-end="url(#tipA)" d="M785 121 H807"/>
<rect x="810" y="62" width="168" height="118" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
<text class="accent" x="826" y="90" font-size="12" font-weight="700">05</text>
<text x="826" y="118" font-size="16" font-weight="700">Retrieval</text>
<text class="muted" x="826" y="143" font-size="12.5">project-scoped,</text>
<text class="muted" x="826" y="161" font-size="12.5">scored, budgeted</text>
<path class="flow" marker-end="url(#tipA)" d="M981 121 H1003"/>
<rect x="1006" y="62" width="168" height="118" rx="12" fill="#2b2112" stroke="#ffb847" stroke-width="1.3"/>
<text class="accent" x="1022" y="90" font-size="12" font-weight="700">06</text>
<text x="1022" y="118" font-size="16" font-weight="700">Grounded answer</text>
<text class="muted" x="1022" y="143" font-size="12.5">cites its sources,</text>
<text class="muted" x="1022" y="161" font-size="12.5">or says it has none</text>
</svg>

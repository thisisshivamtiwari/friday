<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Architecture: four surfaces share one AIEngineController, which drives the listen, understand and answer pipelines over three local stores">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1f2328; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { fill: #59636e; }
  .accent { fill: #bc6c00; }
  .link { fill: #5b5bd6; }
  .good { fill: #1a7f37; }
  .lane { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #59636e; }
  .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
  .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
  .wire { stroke: #59636e; stroke-width: 1.6; fill: none; }
  .flow { stroke: #bc6c00; stroke-width: 2; fill: none; stroke-dasharray: 6 7;
           animation: flow 1.1s linear infinite; }
  .bar { fill: #ffb847; transform-box: fill-box; transform-origin: center;
          animation: wave 1.5s ease-in-out infinite; }
  .pulse { transform-box: fill-box; transform-origin: center;
            animation: pulse 3.2s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  @keyframes wave { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .75; }
                      50% { transform: scale(1.06); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .bar, .pulse { animation: none; } }
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><marker id="tipA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#bc6c00"/></marker></defs>
<rect class="panel" x="1" y="1" width="1198" height="758" rx="16"/>
<text class="lane" x="30" y="40">SURFACES</text>
<rect class="card" x="30" y="54" width="276" height="58" rx="9"/><text class="" x="168.0" y="80.0" text-anchor="middle" font-size="13" font-weight="600">Overlay</text><text class="muted" x="168.0" y="97.0" text-anchor="middle" font-size="11.5">help me right now  ·  ⌘⇧A</text>
<rect class="card" x="318" y="54" width="276" height="58" rx="9"/><text class="" x="456.0" y="80.0" text-anchor="middle" font-size="13" font-weight="600">Workspace</text><text class="muted" x="456.0" y="97.0" text-anchor="middle" font-size="11.5">state of everything  ·  ⌘0</text>
<rect class="card" x="606" y="54" width="276" height="58" rx="9"/><text class="" x="744.0" y="80.0" text-anchor="middle" font-size="13" font-weight="600">Knowledge Graph</text><text class="muted" x="744.0" y="97.0" text-anchor="middle" font-size="11.5">how it all connects  ·  ⌘⇧G</text>
<rect class="card" x="894" y="54" width="276" height="58" rx="9"/><text class="" x="1032.0" y="80.0" text-anchor="middle" font-size="13" font-weight="600">Settings</text><text class="muted" x="1032.0" y="97.0" text-anchor="middle" font-size="11.5">keys, models, privacy  ·  ⌘,</text>
<path class="wire" marker-end="url(#tip)" d="M600 116 V146"/>
<text class="lane" x="30" y="166">ORCHESTRATION</text>
<rect class="card" x="30" y="180" width="1140" height="56" rx="9" style="fill:#eeeeff;stroke:#5b5bd6"/><text class="mono" x="600.0" y="205.0" text-anchor="middle" font-size="13" font-weight="600">AIEngineController</text><text class="muted" x="600.0" y="222.0" text-anchor="middle" font-size="11.5">one shared object graph behind every surface, so there is exactly one set of stores</text>
<path class="wire" marker-end="url(#tip)" d="M216 240 V268"/>
<rect x="30" y="272" width="372" height="298" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text class="lane accent" x="48" y="298">LISTEN</text>
<rect class="card" x="48" y="310" width="163" height="48" rx="9"/><text class="" x="129.5" y="331.0" text-anchor="middle" font-size="13" font-weight="600">Microphone</text><text class="muted" x="129.5" y="348.0" text-anchor="middle" font-size="11.5">AudioCaptureManager</text>
<rect class="card" x="221" y="310" width="163" height="48" rx="9"/><text class="" x="302.5" y="331.0" text-anchor="middle" font-size="13" font-weight="600">System audio</text><text class="muted" x="302.5" y="348.0" text-anchor="middle" font-size="11.5">SystemAudioCaptureManager</text>
<path class="flow" marker-end="url(#tipA)" d="M216 360 V372"/>
<rect class="card" x="48" y="374" width="336" height="48" rx="9"/><text class="mono" x="216.0" y="395.0" text-anchor="middle" font-size="13" font-weight="600">AudioMixer</text><text class="muted" x="216.0" y="412.0" text-anchor="middle" font-size="11.5">one real waveform</text>
<path class="flow" marker-end="url(#tipA)" d="M216 424 V436"/>
<rect class="card" x="48" y="438" width="336" height="48" rx="9"/><text class="mono" x="216.0" y="459.0" text-anchor="middle" font-size="13" font-weight="600">GeminiLiveClient</text><text class="muted" x="216.0" y="476.0" text-anchor="middle" font-size="11.5">WebSocket, transcription only</text>
<path class="flow" marker-end="url(#tipA)" d="M216 488 V500"/>
<rect class="card" x="48" y="502" width="336" height="48" rx="9"/><text class="mono" x="216.0" y="523.0" text-anchor="middle" font-size="13" font-weight="600">ChatSessionManager</text><text class="muted" x="216.0" y="540.0" text-anchor="middle" font-size="11.5">appends what was heard, live</text>
<path class="wire" marker-end="url(#tip)" d="M216 574 V602"/>
<path class="wire" marker-end="url(#tip)" d="M600 240 V268"/>
<rect x="414" y="272" width="372" height="298" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text class="lane accent" x="432" y="298">UNDERSTAND</text>
<rect class="card" x="432" y="310" width="336" height="48" rx="9"/><text class="mono" x="600.0" y="331.0" text-anchor="middle" font-size="13" font-weight="600">ExtractionHeuristics</text><text class="muted" x="600.0" y="348.0" text-anchor="middle" font-size="11.5">local pre-filter, no model</text>
<path class="flow" marker-end="url(#tipA)" d="M600 360 V372"/>
<rect class="card" x="432" y="374" width="336" height="48" rx="9"/><text class="mono" x="600.0" y="395.0" text-anchor="middle" font-size="13" font-weight="600">SensitiveContentGate</text><text class="muted" x="600.0" y="412.0" text-anchor="middle" font-size="11.5">drops credential-like text</text>
<path class="flow" marker-end="url(#tipA)" d="M600 424 V436"/>
<rect class="card" x="432" y="438" width="336" height="48" rx="9"/><text class="mono" x="600.0" y="459.0" text-anchor="middle" font-size="13" font-weight="600">ExtractionLLMClient</text><text class="muted" x="600.0" y="476.0" text-anchor="middle" font-size="11.5">structured candidates</text>
<path class="flow" marker-end="url(#tipA)" d="M600 488 V500"/>
<rect class="card" x="432" y="502" width="336" height="48" rx="9"/><text class="mono" x="600.0" y="523.0" text-anchor="middle" font-size="13" font-weight="600">ExtractionCoordinator</text><text class="muted" x="600.0" y="540.0" text-anchor="middle" font-size="11.5">project resolution, linking</text>
<path class="wire" marker-end="url(#tip)" d="M600 574 V602"/>
<path class="wire" marker-end="url(#tip)" d="M984 240 V268"/>
<rect x="798" y="272" width="372" height="298" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text class="lane accent" x="816" y="298">ANSWER</text>
<rect class="card" x="816" y="310" width="336" height="48" rx="9"/><text class="mono" x="984.0" y="331.0" text-anchor="middle" font-size="13" font-weight="600">ContextEngine</text><text class="muted" x="984.0" y="348.0" text-anchor="middle" font-size="11.5">retrieve, score, budget</text>
<path class="flow" marker-end="url(#tipA)" d="M984 360 V372"/>
<rect class="card" x="816" y="374" width="336" height="48" rx="9"/><text class="mono" x="984.0" y="395.0" text-anchor="middle" font-size="13" font-weight="600">CrossLayerConflictResolver</text><text class="muted" x="984.0" y="412.0" text-anchor="middle" font-size="11.5">deterministic dedup</text>
<path class="flow" marker-end="url(#tipA)" d="M984 424 V436"/>
<rect class="card" x="816" y="438" width="336" height="48" rx="9"/><text class="mono" x="984.0" y="459.0" text-anchor="middle" font-size="13" font-weight="600">ContextPacketFormatter</text><text class="muted" x="984.0" y="476.0" text-anchor="middle" font-size="11.5">evidence + grounding directive</text>
<path class="flow" marker-end="url(#tipA)" d="M984 488 V500"/>
<rect class="card" x="816" y="502" width="336" height="48" rx="9"/><text class="mono" x="984.0" y="523.0" text-anchor="middle" font-size="13" font-weight="600">GeminiResponseGenerator</text><text class="muted" x="984.0" y="540.0" text-anchor="middle" font-size="11.5">streaming, one shot</text>
<path class="wire" marker-end="url(#tip)" d="M984 574 V602"/>
<text class="lane" x="30" y="622">STATE, IN MEMORY, MIRRORED TO DISK</text>
<rect x="30" y="636" width="372" height="96" rx="12" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.2"/>
<text class="mono" x="48" y="664" font-size="13" font-weight="600">ChatSessionManager</text>
<text class="mono good" x="48" y="688" font-size="13" font-weight="600">↳ ChatSessionStore</text>
<text class="muted" x="48" y="713" font-size="11.5">every word, never trimmed  ·  own Core Data stack</text>
<rect x="414" y="636" width="372" height="96" rx="12" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.2"/>
<text class="mono" x="432" y="664" font-size="13" font-weight="600">MemoryManager</text>
<text class="mono good" x="432" y="688" font-size="13" font-weight="600">↳ MemoryStore</text>
<text class="muted" x="432" y="713" font-size="11.5">entities, edges, supersession  ·  own Core Data stack</text>
<rect x="798" y="636" width="372" height="96" rx="12" fill="#e6f6ea" stroke="#1a7f37" stroke-width="1.2"/>
<text class="mono" x="816" y="664" font-size="13" font-weight="600">ProjectManager</text>
<text class="mono good" x="816" y="688" font-size="13" font-weight="600">↳ ProjectStore</text>
<text class="muted" x="816" y="713" font-size="11.5">items, decisions, events  ·  own Core Data stack</text>
</svg>
